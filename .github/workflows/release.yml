name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin package
        run: python build.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="solodeck-v$(python -c "import json; print(json.load(open('package.json'))['version'])").zip"
          tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$tag" "$archive" \
            --title "Solodeck main build ${GITHUB_RUN_NUMBER}" \
            --generate-notes
